
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miru's Loading...</title>

  <style>
    * {
      box-sizing: border-box;
    }

    
    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Trebuchet MS", Arial, sans-serif;
      background: repeating-linear-gradient(
        135deg,
        #ffeaf2 0px,
        #ffeaf2 18px,
        #fff7fa 18px,
        #fff7fa 36px
      );
      color: #7c435a;
    }

    /* Trang loading luôn tồn tại bên dưới cửa sổ */

 
.loading-screen {
  width: 560px;
  min-height: 420px;
  max-width: 94vw;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 30px;
  box-sizing: border-box;
}


    .loading-title {
      margin: 0 0 12px;
      color: #d76d98;
      font-size: clamp(23px, 5vw, 32px);
      font-weight: 900;
      text-align: center;
      text-shadow: 2px 2px 0 white;
    }

    /* Nhân vật */

    .couple-one-area {
      width: min(280px, 75vw);
      margin: 0 auto;
    }

    .couple-one-track {
      position: relative;
      width: 100%;
      height: 140px;
    }

    .couple-one {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 196px;
      height: 140px;
      object-fit: contain;
      object-position: center bottom;
      transform-origin: center bottom;
      animation: jiggle 1.2s ease-in-out infinite;
      will-change: left, transform;
    }

    @keyframes jiggle {
      0%, 100% {
        transform: rotate(0deg) translateY(0);
      }
      25% {
        transform: rotate(-2deg) translateY(-2px);
      }
      50% {
        transform: rotate(0deg) translateY(0);
      }
      75% {
        transform: rotate(2deg) translateY(-2px);
      }
    }

    .ground {
      width: 100%;
      height: 5px;
      margin-top: -2px;
      border-radius: 50%;
      background: #c78b9e;
      opacity: 0.75;
    }

    /* Thanh loading */

    .progress-container {
      width: min(280px, 75vw);
      height: 24px;
      margin-top: 30px;
      padding: 2px;
      border: 2px solid #e99ab8;
      border-radius: 20px;
      background: white;
      overflow: hidden;
      box-shadow: 0 3px 0 #f8d2e0;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      border-radius: 12px;
      background: repeating-linear-gradient(
        120deg,
        #f6a8c5 0px,
        #f6a8c5 10px,
        #ffe0ec 10px,
        #ffe0ec 20px
      );
    }

    .percentage {
      margin: 9px 0 0;
      color: #bd6288;
      font-size: 15px;
      font-weight: bold;
    }

    .loading-text {
      min-height: 24px;
      margin-top: 7px;
      color: #a96b83;
      font-size: 14px;
    }

    /* Cửa sổ nổi */

  
.dessert-window {
  position: fixed;
  z-index: 10;
  top: 50%;
  left: 50%;
  width: min(400px, calc(100vw - 30px));
  overflow: hidden;
  border: 2px solid #e8a1bd;
  border-radius: 11px;
  background: #fff;
  box-shadow:
    0 12px 35px rgba(155, 80, 112, 0.23),
    0 0 0 4px rgba(255, 255, 255, 0.7);
  transform: translate(-50%, -50%);
  animation: windowAppear 0.35s ease-out;
}

.dessert-window.hidden {
  display: none;
}

    @keyframes windowAppear {
      from {
        opacity: 0;
        transform: translate(-50%, -47%) scale(0.94);
      }
      to {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
    }


    .window-title {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      color: #86445f;
      font-size: 13px;
      font-weight: bold;
    }

    .window-title-icon {
      font-size: 17px;
    }

    .window-controls {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    .window-control {
      width: 23px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(150, 65, 100, 0.15);
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.5);
      color: #87445e;
      font-family: Arial, sans-serif;
      font-size: 13px;
      pointer-events: none;
    }

    .window-control.close {
      background: #ffdeeb;
      font-size: 16px;
    }

    .window-content {
      position: relative;
      padding: 20px 20px 22px;
      text-align: center;
      background: #fffdfE;
    }

    .question-heading {
      position: relative;
      margin: 0 0 17px;
      padding-right: 27px;
      color: #c65e8a;
      font-size: 19px;
      font-weight: 900;
      line-height: 1.4;
    }

    /* Icon tức giận với hiệu ứng boing */

    .anger-icon {
      position: absolute;
      top: -2px;
      right: -3px;
      width: 25px;
      height: 25px;
      color: #f04467;
      font-family: Arial, sans-serif;
      font-size: 25px;
      line-height: 25px;
      opacity: 0;
      transform: scale(0);
      pointer-events: none;
    }

    .anger-icon.show {
      opacity: 1;
      animation: angerBoing 0.55s ease-out both;
    }

    @keyframes angerBoing {
      0% {
        transform: scale(0);
      }
      45% {
        transform: scale(1.45);
      }
      65% {
        transform: scale(0.8);
      }
      82% {
        transform: scale(1.15);
      }
      100% {
        transform: scale(1);
      }
    }

    /* Ảnh món tráng miệng */

    .dessert-image-wrap {
      width: 100%;
      height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 19px;
      border: 2px dashed #f5c2d7;
      border-radius: 14px;
      background: repeating-linear-gradient(
        135deg,
        #fff5f9 0px,
        #fff5f9 12px,
        #ffedf4 12px,
        #ffedf4 24px
      );
    }

    .dessert-image {
      max-width: 90%;
      max-height: 145px;
      object-fit: contain;
      animation: dessertFloat 2s ease-in-out infinite;
    }

    @keyframes dessertFloat {
      0%, 100% {
        transform: translateY(0) rotate(-2deg);
      }
      50% {
        transform: translateY(-4px) rotate(2deg);
      }
    }

    .button-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .answer-button {
      min-width: 105px;
      padding: 10px 23px;
      border: 2px solid #e7a0bb;
      border-radius: 13px;
      background: #fff0f6;
      color: #b85b83;
      font-family: inherit;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 4px 0 #f1c5d7;
      transition:
        transform 0.15s ease,
        background 0.15s ease,
        box-shadow 0.15s ease;
    }

    .answer-button:hover:not(:disabled) {
      transform: translateY(-2px);
      background: #ffe1ed;
      box-shadow: 0 6px 0 #f1c5d7;
    }

    .answer-button:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #f1c5d7;
    }

    .answer-button.yes {
      border-color: #ed91b5;
      background: #f7a9c9;
      color: white;
      box-shadow: 0 4px 0 #dd7ca3;
    }

    .answer-button.yes:hover:not(:disabled) {
      background: #ee91b7;
      box-shadow: 0 6px 0 #dd7ca3;
    }

    .answer-button.no {
      border-color: #e9b4c8;
      background: #fff7fa;
      color: #b26d89;
    }

    .window-footnote {
      margin: 17px 0 0;
      color: #c08ca2;
      font-size: 11px;
    }

    @media (max-width: 480px) {
      .couple-one-track {
        height: 110px;
      }

      .couple-one {
        width: 168px;
        height: 110px;
      }

      .couple-one-area,
      .progress-container {
        width: min(240px, 75vw);
      }

      .window-content {
        padding: 17px 15px 19px;
      }

      .dessert-image-wrap {
        height: 140px;
      }

      .dessert-image {
        max-height: 125px;
      }

      .question-heading {
        font-size: 17px;
      }

      .answer-button {
        min-width: 95px;
      }
    }
  </style>
</head>

<body>
  <!-- Trang loading gốc: không bị cửa sổ thay thế -->

  <main class="loading-screen">
    <h1 class="loading-title">Miru is loading... ♡</h1>

    <div class="couple-one-area">
      <div class="couple-one-track" id="coupleTrack">
        <img
          class="couple-one"
          id="couple"
          src="couple(1).png"
          alt="Miru"
        >
      </div>
      <div class="ground"></div>
    </div>

    <div class="progress-container">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <p class="percentage" id="percentage">0%</p>
    <div class="loading-text" id="loadingText">loading.</div>
  </main>

  <!-- Cửa sổ tráng miệng -->

  <section
    class="dessert-window hidden"
    id="dessertWindow"
    role="dialog"
    aria-label="Miru's Dessert Shop"
  >
    <div class="window-titlebar">
      <div class="window-title">
        <span class="window-title-icon">🍰</span>
        <span>Miru's Dessert Shop</span>
      </div>

      <div class="window-controls" aria-hidden="true">
        <span class="window-control">−</span>
        <span class="window-control">□</span>
        <span class="window-control close">×</span>
      </div>
    </div>

    <div class="window-content">
      <h2 class="question-heading">
        Miru spotted a dessert.
        <br>
        Do you wanna buy it for her?

        <span class="anger-icon" id="angerIcon" aria-label="Angry">
          💢
        </span>
      </h2>

      <div class="dessert-image-wrap">
        <img
          class="dessert-image"
          id="dessertImage"
          src="cake.png"
          alt="A dessert for Miru"
        >
      </div>

      <!-- Không lặp lại câu hỏi bên dưới ảnh -->

      <div class="button-row">
        <button class="answer-button yes" id="yesButton" type="button">
          Yes ♡
        </button>

        <button class="answer-button no" id="noButton" type="button">
          No
        </button>
      </div>

      <p class="window-footnote">
        ♡ A little dessert makes Miru happy ♡
      </p>
    </div>
  </section>

  <script>
    const couple = document.getElementById("couple");
    const coupleTrack = document.getElementById("coupleTrack");
    const progressFill = document.getElementById("progressFill");
    const percentageText = document.getElementById("percentage");
    const loadingText = document.getElementById("loadingText");

    const dessertWindow = document.getElementById("dessertWindow");
    const dessertImage = document.getElementById("dessertImage");
    const yesButton = document.getElementById("yesButton");
    const noButton = document.getElementById("noButton");
    const angerIcon = document.getElementById("angerIcon");

    const desserts = [
      "bánh cuộn.png",
      "bông gòn.png",
      "cake.png",
      "croissant.png",
      "kem.png",
      "macaron.png",
      "tart trứng.png"
    ];

    // Các món đã được bấm Yes sẽ không xuất hiện lại.
    const acceptedDesserts = new Set();

    let progress = 0;
    let yesCount = 0;
    let isMoving = false;
    let isWaitingForNo = false;
    let lastDessert = "";

    const TOTAL_YES_CLICKS = 7;
    const INITIAL_LOADING_DURATION = 1800;
    const MOVE_DURATION = 850;

    // Khoảng nghỉ giữa các lượt giống nhau: 2 giây.
    const WINDOW_DELAY_AFTER_YES = 2000;
    const WINDOW_DELAY_AFTER_NO = 2000;

    let loadingTimer = null;
    let animationFrame = null;

    /* Cập nhật thanh tiến độ và vị trí nhân vật */

    function updateProgress(value) {
      progress = Math.max(0, Math.min(100, value));

      progressFill.style.width = progress + "%";
      percentageText.textContent = Math.round(progress) + "%";

      const trackWidth = coupleTrack.clientWidth;
      const characterWidth = couple.offsetWidth;
      const maxLeft = Math.max(0, trackWidth - characterWidth);

      couple.style.left =
        (maxLeft * progress / 100) + "px";
    }

    /* Chọn ngẫu nhiên trong những món chưa được Yes */

    function chooseRandomDessert() {
      const availableDesserts = desserts.filter(
        dessert => !acceptedDesserts.has(dessert)
      );

      if (availableDesserts.length === 0) {
        return false;
      }

      const chosen = availableDesserts[
        Math.floor(Math.random() * availableDesserts.length)
      ];

      lastDessert = chosen;
      dessertImage.src = chosen;
      dessertImage.alt = chosen.replace(".png", "");

      return true;
    }

    function showDessertWindow() {
      angerIcon.classList.remove("show");

      if (!chooseRandomDessert()) {
        finishLoading();
        return;
      }

      dessertWindow.classList.remove("hidden");
    }

    function hideDessertWindow() {
      dessertWindow.classList.add("hidden");
    }

    /* Loading ban đầu chạy đến 10% */

    function startInitialLoading() {
      const startTime = performance.now();

      function step(now) {
        const elapsed = now - startTime;
        const fraction = Math.min(
          1,
          elapsed / INITIAL_LOADING_DURATION
        );

        updateProgress(10 * fraction);

        if (fraction < 1) {
          animationFrame = requestAnimationFrame(step);
        } else {
          updateProgress(10);

          setTimeout(() => {
            showDessertWindow();
          }, 500);
        }
      }

      animationFrame = requestAnimationFrame(step);
    }

    /* Chữ loading tiếp tục hoạt động bên dưới cửa sổ */

    let dots = 1;

    loadingTimer = setInterval(() => {
      dots = dots % 3 + 1;
      loadingText.textContent = "loading" + ".".repeat(dots);
    }, 500);

    /* Di chuyển nhân vật, vẫn giữ animation jiggle */

    function moveToProgress(targetProgress) {
      return new Promise(resolve => {
        const startProgress = progress;
        const distance = targetProgress - startProgress;
        const startTime = performance.now();

        isMoving = true;
        yesButton.disabled = true;
        noButton.disabled = true;

        function step(now) {
          const elapsed = now - startTime;
          const t = Math.min(1, elapsed / MOVE_DURATION);
          const eased = 1 - Math.pow(1 - t, 3);

          updateProgress(startProgress + distance * eased);

          if (t < 1) {
            animationFrame = requestAnimationFrame(step);
          } else {
            updateProgress(targetProgress);

            isMoving = false;
            yesButton.disabled = false;
            noButton.disabled = false;

            resolve();
          }
        }

        animationFrame = requestAnimationFrame(step);
      });
    }

    /* Bấm Yes: ghi nhớ món và loại khỏi các lượt sau */

    async function handleYes() {
      if (isMoving || isWaitingForNo) return;
      if (yesCount >= TOTAL_YES_CLICKS) return;

      if (lastDessert) {
        acceptedDesserts.add(lastDessert);
      }

      yesCount++;
      hideDessertWindow();

      let targetProgress;

      if (yesCount === TOTAL_YES_CLICKS) {
        targetProgress = 100;
      } else {
        const clicksRemaining = TOTAL_YES_CLICKS - yesCount;
        const minTarget = Math.ceil(progress + 5);
        const maxTarget = Math.floor(
          100 - clicksRemaining * 5
        );

        targetProgress =
          Math.floor(
            Math.random() * (maxTarget - minTarget + 1)
          ) + minTarget;
      }

      await moveToProgress(targetProgress);

      if (yesCount < TOTAL_YES_CLICKS) {
        // Cửa sổ quay lại sau 2 giây.
        setTimeout(() => {
          showDessertWindow();
        }, WINDOW_DELAY_AFTER_YES);
      } else {
        finishLoading();
      }
    }

    /*
      Bấm No:
      1. Icon boing xuất hiện trên cửa sổ.
      2. Cửa sổ vẫn hiện trong 2 giây để người xem thấy icon.
      3. Cửa sổ ẩn đi 2 giây.
      4. Cửa sổ hiện lại, tiến độ giữ nguyên.
    */

    function handleNo() {
      if (isMoving || isWaitingForNo) return;

      isWaitingForNo = true;

      angerIcon.classList.remove("show");
      void angerIcon.offsetWidth;
      angerIcon.classList.add("show");

      setTimeout(() => {
        hideDessertWindow();

        setTimeout(() => {
          isWaitingForNo = false;
          showDessertWindow();
        }, WINDOW_DELAY_AFTER_NO);

      }, 2000);
    }

    /* Kết thúc loading */

    function finishLoading() {
      updateProgress(100);
      loadingText.textContent = "Done! ♡";
      percentageText.textContent = "100%";

      clearInterval(loadingTimer);

      // Muốn chuyển sang trang khác thì bỏ dấu //:
      // window.location.href = "page4.html";
    }

    yesButton.addEventListener("click", handleYes);
    noButton.addEventListener("click", handleNo);

    /* Khởi tạo sau khi ảnh nhân vật tải xong */

    function initialize() {
      updateProgress(0);
      startInitialLoading();
    }

    if (couple.complete) {
      initialize();
    } else {
      couple.addEventListener("load", initialize, { once: true });
      couple.addEventListener("error", initialize, { once: true });
    }

    window.addEventListener("resize", () => {
      updateProgress(progress);
    });
  </script>
</body>
</html>
