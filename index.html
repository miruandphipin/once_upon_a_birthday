<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You 💗</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    cursor: none;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #fff5f8;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

/* 📦 KHỐI CHÍNH */
.container {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
}

/* 🎁 CON TRỎ QUÀ */
.custom-cursor {
    position: fixed;
    width: 45px;
    height: 45px;
    object-fit: contain;
    left: 0;
    top: 0;
    pointer-events: none;
    z-index: 99999;
    transform: translate(-8px, -8px);
    display: block;
}

/* ✨ VỆT NHỎ SAU CHUỘT */
.cursor-trail {
    position: fixed;
    width: 7px;
    height: 7px;
    background: #ff8fab;
    border-radius: 50%;
    pointer-events: none;
    z-index: 99998;
    animation: trailFade 0.6s ease-out forwards;
}

@keyframes trailFade {
    0% {
        opacity: 0.8;
        transform: scale(1);
    }

    100% {
        opacity: 0;
        transform: scale(0);
    }
}

/* 💗 TRÁI TIM */
.heart {
    width: 180px;
    height: 180px;
    object-fit: contain;
    user-select: none;
    cursor: none;

    --heart-scale: 1;

    transform: scale(var(--heart-scale));

    animation: gentleWiggle 2.5s ease-in-out infinite;
}

.heart.pop {
    animation: heartPop 0.45s ease-out;
}

/* 💕 PRESS ME */
.press {
    margin-top: 18px;
    color: #ff8fab;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 1px;
    text-align: center;
    width: 100%;
}

/* ➡️ NEXT */
.next {
    display: none;
    width: 130px;
    height: 130px;

    border: 3px solid #ff8fab;
    background: white;
    color: #ff8fab;

    font-size: 18px;
    font-weight: bold;

    align-items: center;
    justify-content: center;

    text-align: center;
    cursor: none;
}

.next.show {
    display: flex;
    animation: appear 0.5s ease-out forwards;
}

/* ✨ SAO */
.star {
    position: fixed;
    width: 8px;
    height: 8px;
    background: #ff8fab;
    transform: rotate(45deg);
    pointer-events: none;
    animation: starFly 0.7s ease-out forwards;
}

/* 💗 TIM LẮC NHẸ */
@keyframes gentleWiggle {
    0%, 100% {
        transform: scale(var(--heart-scale)) rotate(0deg);
    }

    25% {
        transform: scale(var(--heart-scale)) rotate(-3deg);
    }

    50% {
        transform: scale(var(--heart-scale)) rotate(3deg);
    }

    75% {
        transform: scale(var(--heart-scale)) rotate(-2deg);
    }
}

/* 💥 TIM THU NHỎ RỒI POP */
@keyframes heartPop {
    0% {
        transform: scale(calc(var(--heart-scale) * 0.82));
    }

    55% {
        transform: scale(calc(var(--heart-scale) * 1.12));
    }

    100% {
        transform: scale(var(--heart-scale));
    }
}

/* ✨ SAO BAY */
@keyframes starFly {
    0% {
        opacity: 1;
        transform: translate(0, 0) rotate(45deg) scale(1);
    }

    100% {
        opacity: 0;
        transform:
            translate(var(--x), var(--y))
            rotate(180deg)
            scale(0.3);
    }
}

/* 💨 TIM BIẾN MẤT */
@keyframes disappear {
    0% {
        opacity: 1;
        transform: scale(var(--heart-scale));
    }

    100% {
        opacity: 0;
        transform: scale(0);
    }
}

/* ✨ NEXT HIỆN RA */
@keyframes appear {
    0% {
        opacity: 0;
        transform: scale(0);
    }

    100% {
        opacity: 1;
        transform: scale(1);
    }
}

/* 📱 ĐIỆN THOẠI */
@media (hover: none) {
    html,
    body {
        cursor: auto;
    }

    .custom-cursor {
        display: none;
    }
}

@media (max-width: 600px) {
    .heart {
        width: 140px;
        height: 140px;
    }

    .press {
        font-size: 18px;
    }
}
</style>
</head>

<body>

<!-- 🎁 ẢNH DÙNG LÀM CON TRỎ -->
<img
    src="Qu%C3%A0%20Veloria%20.png"
    class="custom-cursor"
    id="customCursor"
    alt=""
>

<!-- 📦 NỘI DUNG CHÍNH -->
<div class="container">

    <!-- 💗 TRÁI TIM -->
    <img
        src="Hapipi%20%2863%29.png"
        class="heart"
        id="heart"
        alt="Heart"
    >

    <!-- 💕 PRESS ME -->
    <div class="press" id="press">
        press me
    </div>

    <!-- ➡️ NEXT -->
    <div class="next" id="next">
        next ♡
    </div>

</div>

<script>

const cursor = document.getElementById("customCursor");
const heart = document.getElementById("heart");
const press = document.getElementById("press");
const next = document.getElementById("next");

let clicks = 0;


/* 🎁 CON TRỎ QUÀ */
document.addEventListener("mousemove", function(event) {

    cursor.style.left = event.clientX + "px";
    cursor.style.top = event.clientY + "px";


    /* ✨ TẠO VỆT SAU CHUỘT */
    const trail = document.createElement("div");

    trail.className = "cursor-trail";

    trail.style.left = event.clientX + "px";
    trail.style.top = event.clientY + "px";

    document.body.appendChild(trail);


    setTimeout(function() {
        trail.remove();
    }, 600);

});


/* 💗 CLICK TRÁI TIM */
heart.addEventListener("click", function() {

    clicks++;


    /* 💗 MỖI LẦN CLICK TIM TO HƠN */
    const scale = 1 + clicks * 0.35;

    heart.style.setProperty(
        "--heart-scale",
        scale
    );


    /* 💥 HIỆU ỨNG THU NHỎ RỒI POP */
    heart.classList.remove("pop");

    void heart.offsetWidth;

    heart.classList.add("pop");


    /* ✨ SAO BAY */
    createStars();


    /* 💗 LẦN CLICK THỨ 3 */
    if (clicks === 3) {

        heart.style.pointerEvents = "none";


        /* 💨 BẮT ĐẦU BIẾN MẤT */
        setTimeout(function() {

            heart.style.animation =
                "disappear 0.45s ease forwards";

            press.style.transition =
                "opacity 0.3s";

            press.style.opacity = "0";

        }, 450);


        /* ➡️ HIỆN NEXT */
        setTimeout(function() {

            heart.style.display = "none";

            press.style.display = "none";

            next.classList.add("show");

        }, 900);

    }

});


/* ✨ TẠO SAO */
function createStars() {

    const rect =
        heart.getBoundingClientRect();

    const centerX =
        rect.left + rect.width / 2;

    const centerY =
        rect.top + rect.height / 2;


    for (let i = 0; i < 10; i++) {

        const star =
            document.createElement("div");

        star.className = "star";


        star.style.left =
            centerX + "px";

        star.style.top =
            centerY + "px";


        const angle =
            Math.random() * Math.PI * 2;

        const distance =
            60 + Math.random() * 100;


        star.style.setProperty(
            "--x",
            Math.cos(angle) * distance + "px"
        );

        star.style.setProperty(
            "--y",
            Math.sin(angle) * distance + "px"
        );


        document.body.appendChild(star);


        setTimeout(function() {
            star.remove();
        }, 700);

    }

}


/* ➡️ NEXT */
next.addEventListener("click", function() {

    window.location.href =
        "page2.html";

});

</script>

</body>
</html>
