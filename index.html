<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You 💗</title>

<style>
    * {
        box-sizing: border-box;
    }

    /* 🎁 ẢNH QUÀ LÀM CON TRỎ CHUỘT */
    html, body {
        cursor: url("Qu%C3%A0%20Veloria%20.png") 16 16, auto;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background: #fff5f8;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        overflow: hidden;
    }

    .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    .heart {
        width: 180px;
        height: 180px;
        object-fit: contain;
        user-select: none;

        --heart-scale: 1;

        transform: scale(var(--heart-scale));
        animation: gentleWiggle 2.5s ease-in-out infinite;
    }

    .heart.pop {
        animation: heartPop 0.45s ease-out;
    }

    .press {
        margin-top: 18px;
        color: #ff8fab;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 1px;
    }

    .next {
        display: none;

        width: 130px;
        height: 130px;

        border: 3px solid #ff8fab;
        background: white;
        color: #ff8fab;

        font-size: 18px;
        font-weight: bold;

        align-items: center;
        justify-content: center;
    }

    .next.show {
        display: flex;
        animation: appear 0.5s ease-out forwards;
    }

    /* ✨ SAO KHI BẤM TRÁI TIM */
    .star {
        position: fixed;
        width: 8px;
        height: 8px;
        background: #ff8fab;
        transform: rotate(45deg);
        pointer-events: none;
        animation: starFly 0.7s ease-out forwards;
    }

    /* 💗 TRÁI TIM LẮC NHẸ */
    @keyframes gentleWiggle {
        0%, 100% {
            transform: scale(var(--heart-scale)) rotate(0deg);
        }

        25% {
            transform: scale(var(--heart-scale)) rotate(-3deg);
        }

        50% {
            transform: scale(var(--heart-scale)) rotate(3deg);
        }

        75% {
            transform: scale(var(--heart-scale)) rotate(-2deg);
        }
    }

    /* 💥 HIỆU ỨNG POP */
    @keyframes heartPop {
        0% {
            transform: scale(calc(var(--heart-scale) * 0.82));
        }

        55% {
            transform: scale(calc(var(--heart-scale) * 1.12));
        }

        100% {
            transform: scale(var(--heart-scale));
        }
    }

    /* ✨ SAO BAY */
    @keyframes starFly {
        0% {
            opacity: 1;
            transform: translate(0, 0) rotate(45deg) scale(1);
        }

        100% {
            opacity: 0;
            transform:
                translate(var(--x), var(--y))
                rotate(180deg)
                scale(0.3);
        }
    }

    /* 💗 TRÁI TIM BIẾN MẤT */
    @keyframes disappear {
        0% {
            opacity: 1;
            transform: scale(var(--heart-scale));
        }

        100% {
            opacity: 0;
            transform: scale(0);
        }
    }

    /* 🎁 NEXT HIỆN RA */
    @keyframes appear {
        0% {
            opacity: 0;
            transform: scale(0);
        }

        100% {
            opacity: 1;
            transform: scale(1);
        }
    }

    @media (max-width: 600px) {
        .heart {
            width: 140px;
            height: 140px;
        }

        .press {
            font-size: 18px;
        }
    }

    /* Điện thoại không có chuột */
    @media (hover: none) {
        html, body {
            cursor: auto;
        }
    }
</style>
</head>

<body>

<div class="container">

    <!-- 💗 ẢNH TRÁI TIM -->
    <img
        src="Hapipi%20%2863%29.png"
        class="heart"
        id="heart"
        alt="Heart"
    >

    <div class="press" id="press">
        press me
    </div>

    <div class="next" id="next">
        next ♡
    </div>

</div>

<script>

const heart = document.getElementById("heart");
const press = document.getElementById("press");
const next = document.getElementById("next");

let clicks = 0;


/* =========================
   💗 BẤM TRÁI TIM
========================= */

heart.addEventListener("click", function() {

    clicks++;

    // Trái tim lớn dần
    const scale = 1 + clicks * 0.35;

    heart.style.setProperty(
        "--heart-scale",
        scale
    );

    // Hiệu ứng pop
    heart.classList.remove("pop");

    void heart.offsetWidth;

    heart.classList.add("pop");

    // Sao bay ra
    createStars();


    /* =========================
       LẦN 3 = LẦN CUỐI
    ========================= */

    if (clicks === 3) {

        // Không cho bấm thêm
        heart.style.pointerEvents = "none";

        // Chờ hiệu ứng pop
        setTimeout(() => {

            // Trái tim biến mất
            heart.style.animation =
                "disappear 0.45s ease forwards";

            // Chữ press me biến mất
            press.style.transition =
                "opacity 0.3s";

            press.style.opacity = "0";

        }, 450);


        // Hiện NEXT sau khi trái tim biến mất
        setTimeout(() => {

            heart.style.display = "none";

            press.style.display = "none";

            next.classList.add("show");

        }, 900);
    }
});


/* =========================
   ✨ TẠO SAO
========================= */

function createStars() {

    const rect = heart.getBoundingClientRect();

    const centerX =
        rect.left + rect.width / 2;

    const centerY =
        rect.top + rect.height / 2;


    for (let i = 0; i < 10; i++) {

        const star =
            document.createElement("div");

        star.classList.add("star");

        star.style.left =
            centerX + "px";

        star.style.top =
            centerY + "px";


        const angle =
            Math.random() * Math.PI * 2;

        const distance =
            60 + Math.random() * 100;


        star.style.setProperty(
            "--x",
            Math.cos(angle) * distance + "px"
        );

        star.style.setProperty(
            "--y",
            Math.sin(angle) * distance + "px"
        );


        document.body.appendChild(star);


        setTimeout(() => {
            star.remove();
        }, 700);
    }
}


/* =========================
   ➡️ NÚT NEXT
========================= */

next.addEventListener("click", function() {

    window.location.href = "page2.html";

});

</script>

</body>
</html>
