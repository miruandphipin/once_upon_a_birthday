
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Gift for You ♡</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body,
    body * {
      cursor: url("./Qu%C3%A0%20Veloria%20.png") 0 0, auto !important;
    }

    button,
    a {
      cursor: url("./Qu%C3%A0%20Veloria%20.png") 0 0, pointer !important;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: "Trebuchet MS", Arial, sans-serif;
      color: #874b64;
      background: repeating-linear-gradient(
        135deg,
        #ffeaf2 0px,
        #ffeaf2 18px,
        #fff7fa 18px,
        #fff7fa 36px
      );
    }

    .main-window {
      width: min(560px, 94vw);
      min-height: 350px;
      padding: 32px 24px;
      text-align: center;
      background: rgba(255, 255, 255, 0.94);
      border: 2px solid #e8a1bd;
      border-radius: 16px;
      box-shadow:
        0 12px 35px rgba(155, 80, 112, 0.18),
        0 0 0 5px rgba(255, 255, 255, 0.65);
      position: relative;
    }

    .window-title {
      margin: -32px -24px 28px;
      padding: 12px 16px;
      background: #f7bfd4;
      border-bottom: 2px solid #e8a1bd;
      border-radius: 13px 13px 0 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: bold;
    }

    .window-dots {
      letter-spacing: 4px;
      color: #a75d7b;
    }

    .message {
      font-size: clamp(18px, 4vw, 23px);
      line-height: 1.6;
      margin: 24px auto;
      max-width: 440px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-top: 28px;
    }

    .choice-button {
      min-width: 105px;
      padding: 11px 24px;
      border: 2px solid #e8a1bd;
      border-radius: 10px;
      background: #ffd5e4;
      color: #874b64;
      font-family: inherit;
      font-size: 16px;
      font-weight: bold;
      box-shadow: 0 4px 0 #e8a1bd;
      transition: transform 0.15s, background 0.15s;
    }

    .choice-button:hover {
      background: #ffc3d9;
      transform: translateY(-2px);
    }

    .choice-button:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #e8a1bd;
    }

    .hidden {
      display: none !important;
    }

    /* Hộp quà */

    .gift-area {
      margin: 28px auto 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .gift-instruction {
      font-size: 19px;
      font-weight: bold;
      margin: 0 0 30px;
      animation: textPulse 1.2s ease-in-out infinite;
    }

    .gift {
      position: relative;
      width: 190px;
      height: 150px;
      flex-shrink: 0;
      margin-top: 38px;
      margin-bottom: 15px;
      border: none;
      padding: 0;
      background: transparent;
      overflow: visible;
      animation: giftWait 1.5s ease-in-out infinite;
    }

    .gift-body {
      position: absolute;
      width: 190px;
      height: 125px;
      left: 0;
      bottom: 0;
      background: #f58eb5;
      border: 2px solid #df76a0;
      border-radius: 12px 12px 18px 18px;
      overflow: hidden;
      box-shadow: 0 8px 0 rgba(196, 102, 143, 0.18);
    }

    /* Dải ruy băng trắng hình chữ thập */

    .ribbon-vertical {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 72px;
      width: 42px;
      background: #fffafc;
      border-left: 1px solid #f5d9e5;
      border-right: 1px solid #f5d9e5;
    }

    .ribbon-horizontal {
      position: absolute;
      top: 43px;
      left: 0;
      right: 0;
      height: 35px;
      background: #fffafc;
      border-top: 1px solid #f5d9e5;
      border-bottom: 1px solid #f5d9e5;
    }

    .gift-lid {
      position: absolute;
      z-index: 3;
      top: 8px;
      left: -8px;
      width: 206px;
      height: 43px;
      border: 2px solid #df76a0;
      border-radius: 10px;
      background: #ffb3ce;
      transform-origin: 18px 36px;
      transition:
        transform 0.9s cubic-bezier(.55, -.25, .8, .3),
        opacity 0.8s ease;
    }

    .lid-ribbon {
      position: absolute;
      left: 74px;
      top: 0;
      width: 42px;
      height: 100%;
      background: #fffafc;
      border-left: 1px solid #f5d9e5;
      border-right: 1px solid #f5d9e5;
    }

    /* Nơ trắng phía trên nắp */

    .bow {
      position: absolute;
      z-index: 4;
      left: 50%;
      top: -31px;
      width: 72px;
      height: 35px;
      transform: translateX(-50%);
      transition: opacity 0.5s;
    }

    .bow::before,
    .bow::after {
      content: "";
      position: absolute;
      top: 4px;
      width: 34px;
      height: 23px;
      background: #fffafc;
      border: 2px solid #f5d9e5;
      border-radius: 60% 60% 45% 60%;
    }

    .bow::before {
      left: 0;
      transform: rotate(25deg);
    }

    .bow::after {
      right: 0;
      transform: rotate(-25deg);
    }

    .bow-knot {
      position: absolute;
      z-index: 2;
      left: 30px;
      top: 10px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fffafc;
      border: 2px solid #f5d9e5;
    }

    /* Hộp rung theo từng đợt */

    @keyframes giftWait {
      0%, 100% {
        transform: translateY(0) rotate(0);
      }
      20% {
        transform: translateY(-5px) rotate(-2deg);
      }
      40% {
        transform: translateY(0) rotate(2deg);
      }
      60% {
        transform: translateY(-3px) rotate(-1deg);
      }
      80% {
        transform: translateY(0) rotate(0);
      }
    }

    @keyframes giftShake {
      0%, 100% {
        transform: rotate(0);
      }
      20% {
        transform: rotate(-6deg);
      }
      40% {
        transform: rotate(6deg);
      }
      60% {
        transform: rotate(-4deg);
      }
      80% {
        transform: rotate(3deg);
      }
    }

    @keyframes textPulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.55;
      }
    }

    .gift.shake {
      animation: giftShake 0.4s ease-in-out;
    }

    .gift.opened {
      animation: none;
    }

    .gift.opened .gift-lid {
      transform: translate(-95px, -100px) rotate(-38deg);
      opacity: 0;
    }

    .gift.opened .bow {
      opacity: 0;
    }

    /* Lời chúc nằm trong hộp */

    .birthday-link {
      position: absolute;
      z-index: 2;
      left: 50%;
      top: 50%;
      width: 155px;
      min-height: 65px;
      padding: 12px 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: translate(-50%, -50%) scale(0.6);
      opacity: 0;
      border: 2px solid #e8a1bd;
      border-radius: 10px;
      background: #fffafc;
      color: #d85f91;
      font-weight: bold;
      font-size: 17px;
      line-height: 1.35;
      text-decoration: none;
      pointer-events: none;
      transition: opacity 0.6s, transform 0.6s;
    }

    .gift.opened .birthday-link {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
      pointer-events: auto;
    }

    .birthday-link:hover {
      background: #ffe5ef;
      text-decoration: underline;
    }

    .tap-count {
      margin: 16px 0 0;
      font-size: 13px;
      color: #b57991;
    }

    .footer-note {
      margin-top: 25px;
      font-size: 12px;
      opacity: 0.7;
    }

    @media (max-width: 480px) {
      .main-window {
        padding: 25px 16px;
      }

      .window-title {
        margin: -25px -16px 24px;
      }

      .gift {
        transform-origin: center;
      }

      .gift.shake {
        animation: giftShake 0.4s ease-in-out;
      }
    }
  </style>
</head>

<body>
  <main class="main-window">
    <div class="window-title">
      <span>🎀 Miru's Gift</span>
      <span class="window-dots">− □ ×</span>
    </div>

    <section id="questionArea">
      <p class="message" id="message">
        Miru was very happy, so she decided give u a gift.
        Would you like to receive it?
      </p>

      <div class="buttons" id="choiceButtons">
        <button class="choice-button" id="yesButton" type="button">
          Yes ♡
        </button>

        <button class="choice-button" id="noButton" type="button">
          No
        </button>
      </div>
    </section>

    <section class="gift-area hidden" id="giftArea">
      <p class="gift-instruction" id="giftInstruction">
        press it
      </p>

      <button
        class="gift"
        id="gift"
        type="button"
        aria-label="Press the gift to open it"
      >
        <span class="gift-body">
          <span class="ribbon-vertical"></span>
          <span class="ribbon-horizontal"></span>

          <a
            class="birthday-link"
            id="birthdayLink"
            href="https://drive.google.com/drive/folders/1wt-TkiMqTkW31kaey6TgAYPWCs_pCyJy?usp=sharing"
            target="_blank"
            rel="noopener noreferrer"
            tabindex="-1"
          >
            Happy Birthday ♡
          </a>
        </span>

        <span class="gift-lid">
          <span class="lid-ribbon"></span>
          <span class="bow">
            <span class="bow-knot"></span>
          </span>
        </span>
      </button>

      <p class="tap-count" id="tapCount">
        A little surprise is waiting for you ♡
      </p>
    </section>

    <div class="footer-note">
      Made with love for you ♡
    </div>
  </main>

  <script>
    const message = document.getElementById("message");
    const yesButton = document.getElementById("yesButton");
    const noButton = document.getElementById("noButton");
    const choiceButtons = document.getElementById("choiceButtons");
    const giftArea = document.getElementById("giftArea");
    const gift = document.getElementById("gift");
    const giftInstruction = document.getElementById("giftInstruction");
    const tapCount = document.getElementById("tapCount");
    const birthdayLink = document.getElementById("birthdayLink");

    let presses = 0;
    let isOpened = false;
    let isShaking = false;

    noButton.addEventListener("click", () => {
      noButton.classList.add("hidden");
      message.textContent = "Receive it! ♡";
    });

    yesButton.addEventListener("click", () => {
      document.getElementById("questionArea").classList.add("hidden");
      giftArea.classList.remove("hidden");
      giftInstruction.textContent = "press it";
    });

    gift.addEventListener("click", (event) => {
      if (isOpened || isShaking) return;

      // Cho phép mở liên kết sau khi hộp quà đã mở
      if (event.target.closest("a")) return;

      presses += 1;
      isShaking = true;

      gift.classList.remove("shake");
      void gift.offsetWidth;
      gift.classList.add("shake");

      tapCount.textContent = `${presses} / 3`;

      if (presses < 3) {
        giftInstruction.textContent =
          presses === 1 ? "again ♡" : "one more time!";
      } else {
        giftInstruction.textContent = "Surprise! ♡";
      }

      gift.addEventListener("animationend", function onShakeEnd(e) {
        if (e.animationName !== "giftShake") return;

        gift.removeEventListener("animationend", onShakeEnd);
        gift.classList.remove("shake");
        isShaking = false;

        if (presses >= 3) {
          isOpened = true;
          gift.classList.add("opened");
          giftInstruction.textContent = "Happy Birthday! ♡";
          tapCount.textContent = "Tap the birthday message to open your gift!";

          birthdayLink.setAttribute("tabindex", "0");
        }
      });
    });
  </script>
</body>
</html>
