<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>♡</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            cursor: none;
        }

        body {
            background-color: #ffc0cb;

            background-image:
                repeating-linear-gradient(
                    90deg,
                    #fff8fa 0px,
                    #fff8fa 50px,
                    #ffc0cb 50px,
                    #ffc0cb 80px
                );

            background-size: 130px 100%;
            animation: stripeMove 4s linear infinite;
        }

        @keyframes stripeMove {
            0% {
                background-position: 0 0;
            }

            100% {
                background-position: 130px 0;
            }
        }

        /* =========================
           CUSTOM CURSOR
        ========================= */

        .custom-cursor {
            position: fixed;
            width: 45px;
            height: 45px;
            object-fit: contain;

            left: 0;
            top: 0;

            pointer-events: none;
            z-index: 99999;

            transform: translate(-8px, -8px);
        }

        .cursor-trail {
            position: fixed;

            width: 7px;
            height: 7px;

            background: #ff8fab;
            border-radius: 50%;

            pointer-events: none;
            z-index: 99998;

            animation: trailFade 0.6s ease-out forwards;
        }

        @keyframes trailFade {
            0% {
                opacity: 0.8;
                transform: scale(1);
            }

            100% {
                opacity: 0;
                transform: scale(0);
            }
        }

        /* =========================
           MAIN BOX
        ========================= */

        .question-box {
            position: absolute;

            left: 50%;
            top: 47%;

            transform: translate(-50%, -50%);

            width: min(88vw, 560px);
            min-height: 500px;

            padding: 40px 30px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            gap: 25px;

            background: rgba(255, 190, 208, 0.88);

            border: 3px solid white;
            border-radius: 28px;

            box-shadow:
                0 15px 40px rgba(255, 90, 130, 0.25);
        }

        /* =========================
           CHARACTER
        ========================= */

        .character {
            width: 240px;
            height: 240px;

            object-fit: contain;
            flex-shrink: 0;
        }

        /* =========================
           QUESTION
        ========================= */

        .question {
            color: white;

            font-family: Arial, sans-serif;

            font-size: 22px;
            font-weight: 600;

            text-align: center;

            line-height: 1.4;

            text-shadow:
                0 2px 4px rgba(255, 100, 140, 0.35);
        }

        /* =========================
           BUTTONS
        ========================= */

        .buttons {
            width: 250px;
            height: 50px;

            display: flex;
            flex-direction: row;

            align-items: center;
            justify-content: center;

            gap: 30px;
        }

        .choice {
            width: 110px;
            height: 48px;

            border: none;
            border-radius: 12px;

            font-family: Arial, sans-serif;
            font-size: 18px;
            font-weight: 600;

            cursor: none;

            transition:
                transform 0.15s ease,
                box-shadow 0.15s ease;
        }

        .choice:hover {
            transform: scale(1.05);
        }

        .yes {
            background: #ff7fa3;
            color: white;

            box-shadow:
                0 5px 12px rgba(255, 80, 120, 0.25);
        }

        .no {
            background: white;
            color: #ff7fa3;

            box-shadow:
                0 5px 12px rgba(255, 255, 255, 0.35);
        }

        /*
            Ban đầu No nằm trong flex.
            Sau lần click đầu tiên mới chuyển sang fixed.
        */

        .no.running {
            position: fixed;

            z-index: 50;

            margin: 0;

            box-shadow: none;
        }

        /* =========================
           DARK OVERLAY
        ========================= */

        .dark-overlay {
            position: fixed;

            inset: 0;

            background: rgba(35, 20, 30, 0.82);

            z-index: 100;

            transform: translateY(-100%);

            transition:
                transform 1.25s ease;
        }

        .dark-overlay.show {
            transform: translateY(0);
        }

        /* =========================
           RESET
        ========================= */

        .reset {
            position: fixed;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            z-index: 200;

            width: 120px;
            height: 48px;

            border: none;
            border-radius: 12px;

            background: white;
            color: #ff7fa3;

            font-family: Arial, sans-serif;
            font-size: 18px;
            font-weight: 600;

            cursor: none;

            opacity: 0;
            pointer-events: none;

            transition:
                opacity 0.5s ease;
        }

        .reset.show {
            opacity: 1;
            pointer-events: auto;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .question-box {
                width: 88vw;
                min-height: 470px;

                padding: 30px 20px;
            }

            .character {
                width: 240px;
                height: 240px;
            }

            .question {
                font-size: 20px;
            }

            .buttons {
                width: 230px;
                gap: 20px;
            }

            .choice {
                width: 105px;
            }
        }

        /* =========================
           TOUCH DEVICES
        ========================= */

        @media (hover: none) {

            html,
            body {
                cursor: auto;
            }

            .custom-cursor,
            .cursor-trail {
                display: none;
            }

            .choice,
            .reset {
                cursor: pointer;
            }
        }
    </style>
</head>

<body>

    <!-- CUSTOM CURSOR -->
    <img
        src="Qu%C3%A0%20Veloria%20.png"
        class="custom-cursor"
        id="customCursor"
        alt=""
    >

    <!-- MAIN -->
    <div class="question-box">

        <img
            src="smilee.png"
            class="character"
            id="character"
            alt=""
        >

        <div class="question">
            Do you want to go on a date with me bibi?
        </div>

        <div class="buttons">

            <button
                class="choice yes"
                id="yes"
            >
                Yes
            </button>

            <button
                class="choice no"
                id="no"
            >
                No
            </button>

        </div>

    </div>

    <!-- DARK SCREEN AFTER 5 NO CLICKS -->
    <div
        class="dark-overlay"
        id="darkOverlay"
    ></div>

    <!-- RESET -->
    <button
        class="reset"
        id="reset"
    >
        Reset
    </button>


    <script>

        const character =
            document.getElementById("character");

        const yes =
            document.getElementById("yes");

        const no =
            document.getElementById("no");

        const darkOverlay =
            document.getElementById("darkOverlay");

        const reset =
            document.getElementById("reset");

        const cursor =
            document.getElementById("customCursor");


        /* =========================
           CHARACTER
        ========================= */

        let currentCharacter = "smilee.png";

        function changeCharacter(newImage) {

            if (currentCharacter === newImage) {
                return;
            }

            currentCharacter = newImage;

            character.src = newImage;
        }


        /* =========================
           NO COUNT
        ========================= */

        let noCount = 0;

        let previousNoX = null;
        let previousNoY = null;


        /* =========================
           CRYY TIMER
        ========================= */

        let cryyLockUntil = 0;

        let cryyTimer = null;

        function isCryyLocked() {
            return Date.now() < cryyLockUntil;
        }


        /* =========================
           MOUSE POSITION
        ========================= */

        let mouseX = 0;
        let mouseY = 0;


        /* =========================
           RECTANGLE CHECK
        ========================= */

        function isMouseInsideRect(x, y, rect) {

            return (
                x >= rect.left &&
                x <= rect.right &&
                y >= rect.top &&
                y <= rect.bottom
            );
        }


        function distanceToRectEdge(x, y, rect) {

            if (
                isMouseInsideRect(
                    x,
                    y,
                    rect
                )
            ) {
                return 0;
            }

            const closestX =
                Math.max(
                    rect.left,
                    Math.min(
                        x,
                        rect.right
                    )
                );

            const closestY =
                Math.max(
                    rect.top,
                    Math.min(
                        y,
                        rect.bottom
                    )
                );

            return Math.sqrt(
                Math.pow(
                    x - closestX,
                    2
                ) +
                Math.pow(
                    y - closestY,
                    2
                )
            );
        }


        /* =========================
           EXPRESSION
        ========================= */

        function updateExpression() {

            if (isCryyLocked()) {
                return;
            }

            if (noCount >= 5) {
                return;
            }

            const yesRect =
                yes.getBoundingClientRect();

            const noRect =
                no.getBoundingClientRect();


            /*
                CHỈ đổi mặt khi chuột
                thật sự nằm trong nút.
            */

            if (
                isMouseInsideRect(
                    mouseX,
                    mouseY,
                    yesRect
                )
            ) {

                changeCharacter(
                    "smilee.png"
                );

                return;
            }


            if (
                isMouseInsideRect(
                    mouseX,
                    mouseY,
                    noRect
                )
            ) {

                changeCharacter(
                    "huhh.png"
                );

                return;
            }

            /*
                Nếu chuột nằm ngoài cả
                hai nút thì giữ nguyên.
            */
        }


        /* =========================
           MOUSE MOVE
        ========================= */

        document.addEventListener(
            "mousemove",
            function(event) {

                mouseX =
                    event.clientX;

                mouseY =
                    event.clientY;


                updateExpression();


                /* Cursor */

                cursor.style.left =
                    event.clientX + "px";

                cursor.style.top =
                    event.clientY + "px";


                /* Pink trail */

                const trail =
                    document.createElement("div");

                trail.className =
                    "cursor-trail";

                trail.style.left =
                    event.clientX + "px";

                trail.style.top =
                    event.clientY + "px";

                document.body.appendChild(
                    trail
                );


                setTimeout(
                    function() {

                        trail.remove();

                    },
                    600
                );
            }
        );


        /* =========================
           AFTER CRYY
        ========================= */

        function checkAfterCryy() {

            const noRect =
                no.getBoundingClientRect();

            const yesRect =
                yes.getBoundingClientRect();


            const distanceToNo =
                distanceToRectEdge(
                    mouseX,
                    mouseY,
                    noRect
                );


            const distanceToYes =
                distanceToRectEdge(
                    mouseX,
                    mouseY,
                    yesRect
                );


            if (distanceToNo <= 110) {

                changeCharacter(
                    "cryy.png"
                );

                return;
            }


            if (distanceToYes <= 110) {

                changeCharacter(
                    "smilee.png"
                );

                return;
            }


            changeCharacter(
                "huhh.png"
            );
        }


        /* =========================
           MOVE NO BUTTON
        ========================= */

        function moveNo() {

            no.classList.add(
                "running"
            );


            const rect =
                no.getBoundingClientRect();


            const buttonWidth =
                rect.width;

            const buttonHeight =
                rect.height;


            const viewportWidth =
                window.visualViewport
                    ? window.visualViewport.width
                    : window.innerWidth;


            const viewportHeight =
                window.visualViewport
                    ? window.visualViewport.height
                    : window.innerHeight;


            const padding = 25;


            const minX =
                padding;

            const minY =
                padding;


            const maxX =
                Math.max(
                    minX,
                    viewportWidth -
                    buttonWidth -
                    padding
                );


            const maxY =
                Math.max(
                    minY,
                    viewportHeight -
                    buttonHeight -
                    padding
                );


            /*
                Khoảng cách tối thiểu
                tăng dần sau mỗi lần click.
            */

            const minimumDistance =
                170 +
                noCount * 40;


            let newX =
                minX;

            let newY =
                minY;


            let foundPosition =
                false;


            for (
                let i = 0;
                i < 100;
                i++
            ) {

                const candidateX =
                    minX +
                    Math.random() *
                    (maxX - minX);


                const candidateY =
                    minY +
                    Math.random() *
                    (maxY - minY);


                if (
                    previousNoX === null ||
                    previousNoY === null
                ) {

                    newX =
                        candidateX;

                    newY =
                        candidateY;

                    foundPosition =
                        true;

                    break;
                }


                const distance =
                    Math.sqrt(
                        Math.pow(
                            candidateX -
                            previousNoX,
                            2
                        ) +
                        Math.pow(
                            candidateY -
                            previousNoY,
                            2
                        )
                    );


                if (
                    distance >=
                    minimumDistance
                ) {

                    newX =
                        candidateX;

                    newY =
                        candidateY;

                    foundPosition =
                        true;

                    break;
                }
            }


            if (!foundPosition) {

                newX =
                    minX +
                    Math.random() *
                    (maxX - minX);

                newY =
                    minY +
                    Math.random() *
                    (maxY - minY);
            }


            /* Clamp */

            newX =
                Math.max(
                    minX,
                    Math.min(
                        newX,
                        maxX
                    )
                );


            newY =
                Math.max(
                    minY,
                    Math.min(
                        newY,
                        maxY
                    )
                );


            no.style.left =
                newX + "px";

            no.style.top =
                newY + "px";


            /*
                Kiểm tra lần cuối
                để nút không ra ngoài màn hình.
            */

            const finalRect =
                no.getBoundingClientRect();


            let correctedX =
                newX;

            let correctedY =
                newY;


            if (
                finalRect.left <
                padding
            ) {

                correctedX =
                    padding;
            }


            if (
                finalRect.top <
                padding
            ) {

                correctedY =
                    padding;
            }


            if (
                finalRect.right >
                viewportWidth -
                padding
            ) {

                correctedX =
                    viewportWidth -
                    buttonWidth -
                    padding;
            }


            if (
                finalRect.bottom >
                viewportHeight -
                padding
            ) {

                correctedY =
                    viewportHeight -
                    buttonHeight -
                    padding;
            }


            correctedX =
                Math.max(
                    minX,
                    Math.min(
                        correctedX,
                        maxX
                    )
                );


            correctedY =
                Math.max(
                    minY,
                    Math.min(
                        correctedY,
                        maxY
                    )
                );


            no.style.left =
                correctedX + "px";

            no.style.top =
                correctedY + "px";


            previousNoX =
                correctedX;

            previousNoY =
                correctedY;
        }


        /* =========================
           NO BUTTON
        ========================= */

        no.addEventListener(
            "click",
            function(event) {

                event.preventDefault();


                if (noCount >= 5) {
                    return;
                }


                noCount++;


                /*
                    Xóa timer cũ
                    để mỗi click bắt đầu
                    lại 2 giây.
                */

                if (cryyTimer) {

                    clearTimeout(
                        cryyTimer
                    );
                }


                /*
                    Đổi sang cryy
                    ngay lập tức.
                */

                changeCharacter(
                    "cryy.png"
                );


                /*
                    Khóa cryy 2 giây.
                */

                cryyLockUntil =
                    Date.now() + 2000;


                /*
                    Di chuyển nút No.
                */

                moveNo();


                /*
                    Sau 2 giây.
                */

                cryyTimer =
                    setTimeout(
                        function() {

                            if (
                                noCount < 5
                            ) {

                                checkAfterCryy();
                            }

                        },
                        2000
                    );


                /*
                    Sau 5 lần No.
                */

                if (noCount >= 5) {

                    yes.disabled =
                        true;

                    no.disabled =
                        true;


                    darkOverlay.classList.add(
                        "show"
                    );


                    setTimeout(
                        function() {

                            reset.classList.add(
                                "show"
                            );

                        },
                        1250
                    );
                }
            }
        );


        /* =========================
           YES BUTTON
        ========================= */

        yes.addEventListener(
            "click",
            function() {

                if (noCount >= 5) {
                    return;
                }


                window.location.href =
                    "./page3.html";
            }
        );


        /* =========================
           RESET
        ========================= */

        reset.addEventListener(
            "click",
            function() {

                window.location.reload();
            }
        );

    </script>

</body>
</html>
