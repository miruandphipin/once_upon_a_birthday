<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>♡</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    font-family: Arial, sans-serif;
    cursor: none;
}


/* BACKGROUND */

body {
    width: 100vw;
    height: 100vh;

    background-color: #ffc0cb;

    background-image:
        repeating-linear-gradient(
            90deg,
            #fff8fa 0px,
            #fff8fa 50px,
            #ffc0cb 50px,
            #ffc0cb 80px
        );

    background-size: 130px 100%;

    animation: stripeMove 4s linear infinite;
}

@keyframes stripeMove {

    0% {
        background-position: 0 0;
    }

    100% {
        background-position: 130px 0;
    }

}


/* MAIN FRAME */

.question-box {

    position: absolute;

    left: 50%;
    top: 47%;

    transform: translate(-50%, -50%);

    width: min(88vw, 560px);

    min-height: 500px;

    padding: 40px 30px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    gap: 25px;

    background: rgba(255, 190, 208, 0.88);

    border: 3px solid white;

    border-radius: 28px;

    box-shadow:
        0 15px 40px rgba(255, 100, 150, 0.25);

}


/* CHARACTER */

.character {

    width: 180px;
    height: 180px;

    object-fit: contain;

    flex-shrink: 0;
}


/* QUESTION */

.question {

    color: white;

    font-size: 24px;

    font-weight: 500;

    text-align: center;

    line-height: 1.4;

    max-width: 460px;

    text-shadow:
        0 2px 8px rgba(255, 80, 130, 0.25);
}


/* BUTTON AREA */

.buttons {

    display: flex;

    flex-direction: row;

    align-items: center;

    justify-content: center;

    width: 250px;

    height: 50px;

    gap: 30px;
}


/* BUTTON */

.choice {

    width: 110px;
    height: 48px;

    border-radius: 12px;

    border: none;

    font-size: 18px;

    font-weight: 600;

    font-family: Arial, sans-serif;

    cursor: none;
}


/* YES */

.yes {

    background: #ff7fa3;

    color: white;

    box-shadow:
        0 6px 15px rgba(255, 80, 130, 0.25);
}


/* NO */

.no {

    background: white;

    color: #ff7fa3;

    box-shadow: none;
}


/* NO BUTTON AFTER FIRST CLICK */

.no.running {

    position: fixed;

    z-index: 50;

    margin: 0;

    box-shadow: none;
}


/* DARK OVERLAY */

.dark-overlay {

    position: fixed;

    inset: 0;

    background: rgba(35, 20, 30, 0.82);

    z-index: 100;

    transform: translateY(-100%);

    transition: transform 1.25s ease;

    pointer-events: none;
}


.dark-overlay.show {

    transform: translateY(0);
}


/* RESET */

.reset {

    position: fixed;

    left: 50%;

    top: 50%;

    transform:
        translate(-50%, -50%)
        translateY(30px);

    z-index: 200;

    opacity: 0;

    pointer-events: none;

    padding: 13px 30px;

    border: none;

    border-radius: 12px;

    background: white;

    color: #ff7fa3;

    font-size: 18px;

    font-weight: 600;

    font-family: Arial, sans-serif;

    cursor: none;

    transition:
        opacity 0.4s ease,
        transform 0.4s ease;
}


.reset.show {

    opacity: 1;

    pointer-events: auto;

    transform:
        translate(-50%, -50%)
        translateY(0);
}


/* CUSTOM CURSOR */

.custom-cursor {

    position: fixed;

    width: 45px;
    height: 45px;

    object-fit: contain;

    left: 0;
    top: 0;

    pointer-events: none;

    z-index: 99999;

    transform:
        translate(-8px, -8px);
}


/* CURSOR TRAIL */

.cursor-trail {

    position: fixed;

    width: 7px;
    height: 7px;

    background: #ff8fab;

    border-radius: 50%;

    pointer-events: none;

    z-index: 99998;

    animation:
        trailFade 0.6s ease-out forwards;
}


@keyframes trailFade {

    0% {
        opacity: 0.8;
        transform: scale(1);
    }

    100% {
        opacity: 0;
        transform: scale(0);
    }

}


/* MOBILE */

@media (hover: none) {

    html,
    body {
        cursor: auto;
    }

    .custom-cursor {
        display: none;
    }

    .cursor-trail {
        display: none;
    }

    .choice {
        cursor: pointer;
    }

    .reset {
        cursor: pointer;
    }

}


/* SMALL SCREEN */

@media (max-width: 600px) {

    .question-box {

        width: 88vw;

        min-height: 470px;

        padding: 30px 20px;

    }

    .character {

        width: 240px;
        height: 240px;

    }

    .question {

        font-size: 20px;

    }

    .buttons {

        width: 230px;

        gap: 20px;

    }

    .choice {

        width: 105px;

    }

}

</style>
</head>


<body>


<!-- MAIN -->

<div class="question-box">

    <img
        src="smilee.png"
        id="character"
        class="character"
        alt=""
    >

    <div class="question">
        Do you want to go on a date with me bibi?
    </div>

    <div class="buttons">

        <button
            class="choice yes"
            id="yes"
        >
            Yes
        </button>

        <button
            class="choice no"
            id="no"
        >
            No
        </button>

    </div>

</div>


<!-- DARK OVERLAY -->

<div
    class="dark-overlay"
    id="darkOverlay"
></div>


<!-- RESET -->

<button
    class="reset"
    id="reset"
>
    Reset
</button>


<!-- CUSTOM CURSOR -->

<img
    src="Qu%C3%A0%20Veloria%20.png"
    class="custom-cursor"
    id="customCursor"
    alt=""
>


<script>


const character =
    document.getElementById("character");

const yes =
    document.getElementById("yes");

const no =
    document.getElementById("no");

const darkOverlay =
    document.getElementById("darkOverlay");

const reset =
    document.getElementById("reset");

const cursor =
    document.getElementById("customCursor");


/*
CHARACTER
*/

let currentCharacter = "smilee.png";


function changeCharacter(newImage) {

    if (currentCharacter === newImage) return;

    currentCharacter = newImage;

    character.src = newImage;
}


/*
NO COUNT
*/

let noCount = 0;

let previousNoX = null;

let previousNoY = null;


/*
CRYY LOCK
*/

let cryyLockUntil = 0;

let cryyTimer = null;


function isCryyLocked() {

    return Date.now() < cryyLockUntil;

}


/*
MOUSE POSITION
*/

let mouseX = 0;

let mouseY = 0;


/*
CHECK MOUSE INSIDE RECTANGLE
*/

function isMouseInsideRect(x, y, rect) {

    return (
        x >= rect.left &&
        x <= rect.right &&
        y >= rect.top &&
        y <= rect.bottom
    );

}


/*
DISTANCE TO RECT EDGE

GIỮ NGUYÊN
*/

function distanceToRectEdge(x, y, rect) {

    if (isMouseInsideRect(x, y, rect)) {

        return 0;

    }

    const closestX =
        Math.max(
            rect.left,
            Math.min(x, rect.right)
        );

    const closestY =
        Math.max(
            rect.top,
            Math.min(y, rect.bottom)
        );

    return Math.sqrt(

        Math.pow(
            x - closestX,
            2
        )

        +

        Math.pow(
            y - closestY,
            2
        )

    );

}


/*
UPDATE EXPRESSION

CHỈ KHI CHUỘT
THỰC SỰ TRONG KHUNG
*/

function updateExpression() {

    if (isCryyLocked()) return;

    if (noCount >= 5) return;


    const yesRect =
        yes.getBoundingClientRect();

    const noRect =
        no.getBoundingClientRect();


    if (
        isMouseInsideRect(
            mouseX,
            mouseY,
            yesRect
        )
    ) {

        changeCharacter("smilee.png");

        return;

    }


    if (
        isMouseInsideRect(
            mouseX,
            mouseY,
            noRect
        )
    ) {

        changeCharacter("huhh.png");

        return;

    }

}


/*
MOUSE MOVE
*/

document.addEventListener(
    "mousemove",
    function(event) {

        mouseX = event.clientX;

        mouseY = event.clientY;

        updateExpression();


        cursor.style.left =
            event.clientX + "px";

        cursor.style.top =
            event.clientY + "px";


        const trail =
            document.createElement("div");

        trail.className =
            "cursor-trail";

        trail.style.left =
            event.clientX + "px";

        trail.style.top =
            event.clientY + "px";

        document.body.appendChild(trail);


        setTimeout(
            function() {

                trail.remove();

            },
            600
        );

    }
);


/*
CHECK AFTER CRYY

GIỮ NGUYÊN
*/

function checkAfterCryy() {

    const noRect =
        no.getBoundingClientRect();

    const yesRect =
        yes.getBoundingClientRect();


    const distanceToNo =
        distanceToRectEdge(
            mouseX,
            mouseY,
            noRect
        );


    const distanceToYes =
        distanceToRectEdge(
            mouseX,
            mouseY,
            yesRect
        );


    if (distanceToNo <= 110) {

        changeCharacter("cryy.png");

        return;

    }


    if (distanceToYes <= 110) {

        changeCharacter("smilee.png");

        return;

    }


    changeCharacter("huhh.png");

}


/*
MOVE NO BUTTON

ĐÃ SỬA ĐỂ KHÔNG THỂ
CHẠY RA KHỎI MÀN HÌNH
*/

function moveNo() {

    no.classList.add("running");


    /*
    ĐỢI TRÌNH DUYỆT TÍNH LẠI
    KÍCH THƯỚC/VỊ TRÍ NÚT
    */

    const rect =
        no.getBoundingClientRect();


    const buttonWidth =
        rect.width;

    const buttonHeight =
        rect.height;


    /*
    LẤY VIEWPORT THỰC TẾ
    */

    let viewportWidth =
        window.innerWidth;

    let viewportHeight =
        window.innerHeight;


    if (window.visualViewport) {

        viewportWidth =
            window.visualViewport.width;

        viewportHeight =
            window.visualViewport.height;

    }


    /*
    KHOẢNG CÁCH AN TOÀN
    */

    const padding = 25;


    /*
    GIỚI HẠN TUYỆT ĐỐI
    */

    const minX =
        padding;

    const minY =
        padding;


    const maxX =
        Math.max(
            minX,
            viewportWidth -
            buttonWidth -
            padding
        );


    const maxY =
        Math.max(
            minY,
            viewportHeight -
            buttonHeight -
            padding
        );


    let newX;

    let newY;

    let attempts = 0;


    const minimumDistance =
        170 + noCount * 40;


    /*
    TÌM VỊ TRÍ MỚI
    */

    do {

        newX =
            minX +
            Math.random() *
            (maxX - minX);

        newY =
            minY +
            Math.random() *
            (maxY - minY);

        attempts++;


        if (previousNoX === null) {

            break;

        }


        const distance =
            Math.sqrt(

                Math.pow(
                    newX - previousNoX,
                    2
                )

                +

                Math.pow(
                    newY - previousNoY,
                    2
                )

            );


        if (
            distance >= minimumDistance
        ) {

            break;

        }

    }

    while (attempts < 100);


    /*
    KHÓA LẠI TRONG MÀN HÌNH
    */

    newX =
        Math.max(
            minX,
            Math.min(
                newX,
                maxX
            )
        );


    newY =
        Math.max(
            minY,
            Math.min(
                newY,
                maxY
            )
        );


    /*
    ĐẶT VỊ TRÍ
    */

    no.style.left =
        newX + "px";

    no.style.top =
        newY + "px";


    /*
    KIỂM TRA LẠI SAU KHI ĐẶT

    Nếu trình duyệt vẫn tính lệch,
    tự động kéo nút vào lại màn hình.
    */

    const finalRect =
        no.getBoundingClientRect();


    let correctedX =
        newX;

    let correctedY =
        newY;


    if (finalRect.left < padding) {

        correctedX +=
            padding - finalRect.left;

    }


    if (finalRect.top < padding) {

        correctedY +=
            padding - finalRect.top;

    }


    if (
        finalRect.right >
        viewportWidth - padding
    ) {

        correctedX -=
            finalRect.right -
            (viewportWidth - padding);

    }


    if (
        finalRect.bottom >
        viewportHeight - padding
    ) {

        correctedY -=
            finalRect.bottom -
            (viewportHeight - padding);

    }


    /*
    KHÓA LẦN CUỐI
    */

    correctedX =
        Math.max(
            minX,
            Math.min(
                correctedX,
                maxX
            )
        );


    correctedY =
        Math.max(
            minY,
            Math.min(
                correctedY,
                maxY
            )
        );


    no.style.left =
        correctedX + "px";

    no.style.top =
        correctedY + "px";


    previousNoX =
        correctedX;

    previousNoY =
        correctedY;

}


/*
NO CLICK
*/

no.addEventListener(
    "click",
    function(event) {

        event.preventDefault();


        if (noCount >= 5) return;


        noCount++;


        /*
        RESET TIMER CŨ
        */

        if (cryyTimer !== null) {

            clearTimeout(cryyTimer);

        }


        changeCharacter("cryy.png");


        /*
        RESET 2 GIÂY
        */

        cryyLockUntil =
            Date.now() + 2000;


        /*
        MOVE NO
        */

        moveNo();


        /*
        TIMER MỚI
        */

        cryyTimer =
            setTimeout(
                function() {

                    if (noCount < 5) {

                        checkAfterCryy();

                    }

                    cryyTimer = null;

                },
                2000
            );


        /*
        5 LẦN NO
        */

        if (noCount >= 5) {

            yes.disabled = true;

            no.disabled = true;


            darkOverlay.classList.add("show");


            setTimeout(
                function() {

                    reset.classList.add("show");

                },
                1250
            );

        }

    }
);


/*
YES CLICK
*/

yes.addEventListener(
    "click",
    function() {

        if (noCount < 5) {

            window.location.href =
                "page3.html";

        }

    }
);


/*
RESET
*/

reset.addEventListener(
    "click",
    function() {

        window.location.reload();

    }
);

</script>

</body>
</html>
