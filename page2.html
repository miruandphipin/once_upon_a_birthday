<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>For Bibi ♡</title>


<style>

/* =========================================
   CƠ BẢN
========================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;

    overflow: hidden;

    font-family: Arial, sans-serif;

    cursor: none;
}


/* =========================================
   🌸 BACKGROUND
   KHỚP VỚI KHUNG TRÌNH DUYỆT
========================================= */

body {

    background-color: #000;

    background-size: cover;

    background-position: center center;

    background-repeat: no-repeat;

    width: 100vw;
    height: 100vh;
}


/* =========================================
   🎁 CON TRỎ QUÀ
   GIỐNG PAGE 1
========================================= */

.custom-cursor {

    position: fixed;

    width: 45px;
    height: 45px;

    object-fit: contain;

    left: 0;
    top: 0;

    pointer-events: none;

    z-index: 99999;

    transform:
        translate(-8px, -8px);
}


/* =========================================
   ✨ BỤI SAO SAU CHUỘT
========================================= */

.cursor-trail {

    position: fixed;

    width: 7px;
    height: 7px;

    background: #ff8fab;

    border-radius: 50%;

    pointer-events: none;

    z-index: 99998;

    animation:
        trailFade
        0.6s
        ease-out
        forwards;
}


@keyframes trailFade {

    0% {

        opacity: 0.8;

        transform:
            scale(1);
    }

    100% {

        opacity: 0;

        transform:
            scale(0);
    }

}


/* =========================================
   TRANG
========================================= */

.page {

    width: 100vw;
    height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    position: relative;

    padding-bottom: 7vh;

    overflow: hidden;
}


/* =========================================
   💗 KHUNG CHÍNH
========================================= */

.question-box {

    width:
        min(88vw, 560px);

    min-height: 500px;

    padding: 35px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

    position: relative;

    z-index: 10;

    background:
        rgba(255, 190, 208, 0.84);

    border:
        2px solid
        rgba(255, 255, 255, 0.78);

    border-radius: 28px;

    box-shadow:

        0 15px 45px
        rgba(90, 30, 50, 0.18),

        inset 0 0 30px
        rgba(255, 255, 255, 0.18);
}


/* =========================================
   🖼️ HÌNH NHÂN VẬT
   CHỈ HÌNH NÀY FADE
========================================= */

.character {

    width: 180px;
    height: 180px;

    object-fit: contain;

    margin-bottom: 15px;

    user-select: none;

    opacity: 1;

    transition:
        opacity 0.25s ease;
}


.character.fade-out {

    opacity: 0;
}


/* =========================================
   💬 CÂU HỎI
========================================= */

.question {

    color: white;

    font-size: 24px;

    font-weight: 500;

    line-height: 1.4;

    max-width: 460px;

    margin-bottom: 28px;

    text-shadow:
        0 2px 8px
        rgba(0, 0, 0, 0.28);
}


/* =========================================
   YES + NO
========================================= */

.buttons {

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 30px;

    width: 250px;

    height: 50px;

    position: relative;
}


/* =========================================
   NÚT CHUNG
========================================= */

.choice {

    width: 110px;
    height: 48px;

    border: none;

    border-radius: 12px;

    font-family: Arial, sans-serif;

    font-size: 18px;

    font-weight: 600;

    cursor: none;

    transition:
        transform 0.15s ease;
}


.choice:hover {

    transform:
        scale(1.05);
}


/* =========================================
   YES
   CÓ SHADOW
========================================= */

.yes {

    background: #ff7fa3;

    color: white;

    box-shadow:
        0 6px 18px
        rgba(255, 95, 140, 0.35);
}


/* =========================================
   NO
   ❌ KHÔNG CÓ SHADOW
========================================= */

.no {

    background: white;

    color: #ff7fa3;

    box-shadow: none;
}


/* =========================================
   NO SAU KHI BẮT ĐẦU CHẠY
========================================= */

.no.running {

    position: fixed;

    z-index: 50;

    box-shadow: none;

    transition:
        transform 0.15s ease;
}


/* =========================================
   🌑 NỀN U ÁM
========================================= */

.dark-overlay {

    position: fixed;

    left: 0;
    top: -100%;

    width: 100%;
    height: 100%;

    background:
        linear-gradient(
            to bottom,
            rgba(15, 10, 25, 0.96),
            rgba(30, 20, 40, 0.93)
        );

    z-index: 100;

    pointer-events: none;

    opacity: 0;
}


.dark-overlay.show {

    pointer-events: auto;

    animation:
        darkFall
        1.2s
        ease-out
        forwards;
}


@keyframes darkFall {

    0% {

        top: -100%;

        opacity: 0;
    }

    30% {

        opacity: 0.55;
    }

    100% {

        top: 0;

        opacity: 1;
    }

}


/* =========================================
   🔄 RESET
========================================= */

.reset {

    position: fixed;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%)
        scale(0.8);

    width: 120px;
    height: 48px;

    border: none;

    border-radius: 12px;

    background: #ff8fab;

    color: white;

    font-family: Arial, sans-serif;

    font-size: 18px;

    font-weight: 600;

    cursor: none;

    z-index: 101;

    display: none;

    opacity: 0;

    box-shadow:
        0 8px 25px
        rgba(0, 0, 0, 0.25);
}


.reset.show {

    display: block;

    animation:
        resetAppear
        0.5s
        ease-out
        forwards;
}


@keyframes resetAppear {

    0% {

        opacity: 0;

        transform:
            translate(-50%, -50%)
            scale(0.8);
    }

    100% {

        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1);
    }

}


.reset:hover {

    transform:
        translate(-50%, -50%)
        scale(1.05);
}


/* =========================================
   📱 ĐIỆN THOẠI
========================================= */

@media (hover: none) {

    html,
    body {

        cursor: auto;
    }


    .custom-cursor {

        display: none;
    }


    .cursor-trail {

        display: none;
    }


    .choice,
    .reset {

        cursor: pointer;
    }

}


/* =========================================
   📱 MOBILE
========================================= */

@media (max-width: 600px) {

    .page {

        padding-bottom: 5vh;
    }


    .question-box {

        width: 88vw;

        min-height: 450px;

        padding:
            28px 20px 32px;

        border-radius: 24px;
    }


    .character {

        width: 145px;
        height: 145px;

        margin-bottom: 12px;
    }


    .question {

        font-size: 20px;

        padding: 0 8px;

        margin-bottom: 24px;
    }


    .buttons {

        width: 230px;

        gap: 25px;
    }


    .choice {

        width: 100px;

        height: 45px;

        font-size: 17px;
    }

}

</style>

</head>


<body>


<!-- =========================================
     🎁 CON TRỎ QUÀ
========================================= -->

<img
    src="Qu%C3%A0%20Veloria%20.png"
    class="custom-cursor"
    id="customCursor"
    alt=""
>


<div class="page">


    <!-- =================================
         KHUNG CHÍNH
    ================================= -->

    <div class="question-box">


        <!-- 🖼️ HÌNH NHÂN VẬT -->

        <img
            src="smilee.png"
            id="character"
            class="character"
            alt=""
        >


        <!-- 💬 CÂU HỎI -->

        <div class="question">

            Do you want to go on a date with me bibi?

        </div>


        <!-- YES + NO -->

        <div class="buttons">

            <button
                class="choice yes"
                id="yes"
            >
                Yes
            </button>


            <button
                class="choice no"
                id="no"
            >
                No
            </button>

        </div>


    </div>

</div>


<!-- 🌑 NỀN U ÁM -->

<div
    class="dark-overlay"
    id="darkOverlay"
></div>


<!-- 🔄 RESET -->

<button
    class="reset"
    id="reset"
>
    Reset
</button>



<script>


/* =========================================
   ELEMENT
========================================= */

const cursor =
    document.getElementById("customCursor");

const character =
    document.getElementById("character");

const yes =
    document.getElementById("yes");

const no =
    document.getElementById("no");

const darkOverlay =
    document.getElementById("darkOverlay");

const reset =
    document.getElementById("reset");


/* =========================================
   🎁 CON TRỎ + BỤI SAO
========================================= */

document.addEventListener(
    "mousemove",
    function(event) {

        cursor.style.left =
            event.clientX + "px";

        cursor.style.top =
            event.clientY + "px";


        const trail =
            document.createElement("div");

        trail.className =
            "cursor-trail";


        trail.style.left =
            event.clientX + "px";

        trail.style.top =
            event.clientY + "px";


        document.body.appendChild(
            trail
        );


        setTimeout(
            function() {

                trail.remove();

            },
            600
        );

    }
);


/* =========================================
   🌸 BACKGROUND
   bground → bground1 → bground2 → bground3
   → LẶP LẠI
========================================= */

const backgrounds = [

    "bground.png",
    "bground1.png",
    "bground2.png",
    "bground3.png"

];


let backgroundIndex = 0;


document.body.style.backgroundImage =
    `url("${backgrounds[0]}")`;


setInterval(
    function() {

        backgroundIndex++;


        if (
            backgroundIndex >=
            backgrounds.length
        ) {

            backgroundIndex = 0;

        }


        document.body.style.backgroundImage =
            `url("${backgrounds[backgroundIndex]}")`;

    },
    500
);


/* =========================================
   🖼️ ĐỔI HÌNH NHÂN VẬT
   CHỈ FADE HÌNH
========================================= */

let currentCharacter =
    "smilee.png";


function changeCharacter(newImage) {

    if (
        currentCharacter === newImage
    ) {

        return;

    }


    currentCharacter =
        newImage;


    /*
       Fade OUT riêng hình
    */

    character.classList.add(
        "fade-out"
    );


    setTimeout(
        function() {

            character.src =
                newImage;


            /*
               Fade IN riêng hình
            */

            character.classList.remove(
                "fade-out"
            );

        },
        250
    );

}


/* =========================================
   ĐẾM NO
========================================= */

let noCount = 0;


/* =========================================
   VỊ TRÍ NO TRƯỚC ĐÓ
========================================= */

let previousNoX = null;

let previousNoY = null;


/* =========================================
   🖱️ CHUỘT GẦN YES / NO
========================================= */

document.addEventListener(
    "mousemove",
    function(event) {

        if (
            noCount >= 5
        ) {

            return;

        }


        const noRect =
            no.getBoundingClientRect();


        const yesRect =
            yes.getBoundingClientRect();


        /* =================================
           KHOẢNG CÁCH TỚI NO
        ================================= */

        const noCenterX =
            noRect.left
            +
            noRect.width / 2;


        const noCenterY =
            noRect.top
            +
            noRect.height / 2;


        const distanceToNo =
            Math.sqrt(

                Math.pow(
                    event.clientX
                    -
                    noCenterX,
                    2
                )

                +

                Math.pow(
                    event.clientY
                    -
                    noCenterY,
                    2
                )

            );


        /* =================================
           KHOẢNG CÁCH TỚI YES
        ================================= */

        const yesCenterX =
            yesRect.left
            +
            yesRect.width / 2;


        const yesCenterY =
            yesRect.top
            +
            yesRect.height / 2;


        const distanceToYes =
            Math.sqrt(

                Math.pow(
                    event.clientX
                    -
                    yesCenterX,
                    2
                )

                +

                Math.pow(
                    event.clientY
                    -
                    yesCenterY,
                    2
                )

            );


        /* =================================
           GẦN NO → Huhh
        ================================= */

        if (
            distanceToNo < 110
        ) {

            changeCharacter(
                "huhh.png"
            );

        }


        /* =================================
           GẦN YES → Smilee
        ================================= */

        else if (
            distanceToYes < 110
        ) {

            changeCharacter(
                "smilee.png"
            );

        }

    }
);


/* =========================================
   🏃 DI CHUYỂN NO
========================================= */

function moveNo() {

    /*
       Chuyển No từ flex
       sang fixed
    */

    no.classList.add(
        "running"
    );


    const padding = 25;


    const buttonWidth =
        no.offsetWidth;


    const buttonHeight =
        no.offsetHeight;


    const maxX =
        window.innerWidth
        -
        buttonWidth
        -
        padding;


    const maxY =
        window.innerHeight
        -
        buttonHeight
        -
        padding;


    let newX;

    let newY;

    let attempts = 0;


    /*
       Càng bấm nhiều
       càng phải chạy xa
    */

    const minimumDistance =
        170
        +
        noCount * 40;


    do {

        newX =
            padding
            +
            Math.random()
            * maxX;


        newY =
            padding
            +
            Math.random()
            * maxY;


        attempts++;


        if (
            previousNoX === null
        ) {

            break;

        }


        const distance =
            Math.sqrt(

                Math.pow(
                    newX
                    -
                    previousNoX,
                    2
                )

                +

                Math.pow(
                    newY
                    -
                    previousNoY,
                    2
                )

            );


        if (
            distance >=
            minimumDistance
        ) {

            break;

        }

    }

    while (
        attempts < 100
    );


    previousNoX =
        newX;


    previousNoY =
        newY;


    /*
       NHẢY NGAY
    */

    no.style.left =
        newX + "px";


    no.style.top =
        newY + "px";

}


/* =========================================
   ❌ NHẤN NO
========================================= */

no.addEventListener(
    "click",
    function(event) {

        event.preventDefault();


        if (
            noCount >= 5
        ) {

            return;

        }


        noCount++;


        /*
           Bấm No → Cryy
        */

        changeCharacter(
            "cryy.png"
        );


        /*
           No chạy ngay
        */

        moveNo();


        /*
           LẦN THỨ 5
        */

        if (
            noCount >= 5
        ) {

            yes.disabled = true;

            no.disabled = true;


            darkOverlay.classList.add(
                "show"
            );


            setTimeout(
                function() {

                    reset.classList.add(
                        "show"
                    );

                },
                1250
            );

        }

    }
);


/* =========================================
   💗 YES
========================================= */

yes.addEventListener(
    "click",
    function() {

        if (
            noCount < 5
        ) {

            window.location.href =
                "page3.html";

        }

    }
);


/* =========================================
   🔄 RESET
========================================= */

reset.addEventListener(
    "click",
    function() {

        window.location.reload();

    }
);


/* =========================================
   📐 RESIZE
========================================= */

window.addEventListener(
    "resize",
    function() {

        /*
           Nếu No chưa chạy
           thì vẫn để nó trong flex.
        */

        if (
            !no.classList.contains(
                "running"
            )
        ) {

            return;

        }


        const rect =
            no.getBoundingClientRect();


        if (
            rect.right >
            window.innerWidth
        ) {

            no.style.left =
                (
                    window.innerWidth
                    -
                    no.offsetWidth
                    -
                    20
                )
                +
                "px";

        }


        if (
            rect.bottom >
            window.innerHeight
        ) {

            no.style.top =
                (
                    window.innerHeight
                    -
                    no.offsetHeight
                    -
                    20
                )
                +
                "px";

        }

    }
);

</script>


</body>

</html>
