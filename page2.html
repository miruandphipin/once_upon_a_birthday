<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Date?</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    cursor: none;
}

/* =========================
   BACKGROUND
========================= */

body {
    background-color: #ffb6c9;

    background-image:
        repeating-linear-gradient(
            90deg,
            #ffb6c9 0px,
            #ffb6c9 55px,
            #fff8fa 55px,
            #fff8fa 65px
        );

    background-size: 120px 100%;
    animation: stripeMove 4s linear infinite;
}

@keyframes stripeMove {

    0% {
        background-position: 0 0;
    }

    100% {
        background-position: 120px 0;
    }

}

/* =========================
   CUSTOM CURSOR
========================= */

.custom-cursor {
    position: fixed;

    width: 45px;
    height: 45px;

    object-fit: contain;

    left: 0;
    top: 0;

    pointer-events: none;

    z-index: 99999;

    transform: translate(-8px, -8px);
}

.cursor-trail {
    position: fixed;

    width: 7px;
    height: 7px;

    background: #ff8fab;

    border-radius: 50%;

    pointer-events: none;

    z-index: 99998;

    animation: trailFade 0.6s ease-out forwards;
}

@keyframes trailFade {

    0% {
        opacity: 0.8;
        transform: scale(1);
    }

    100% {
        opacity: 0;
        transform: scale(0);
    }

}

/* =========================
   MAIN FRAME
========================= */

.page {
    width: 100%;
    height: 100%;

    display: flex;
    align-items: center;
    justify-content: center;

    padding-bottom: 4vh;
}

.box {
    width: min(700px, 90vw);
    min-height: 560px;

    background: #ff91b3;

    border-radius: 35px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    padding: 40px;

    position: relative;

    box-shadow:
        0 15px 35px rgba(255, 91, 137, 0.25);
}

/* =========================
   CHARACTER
========================= */

.character {
    width: 180px;
    height: 180px;

    object-fit: contain;

    margin-bottom: 15px;

    user-select: none;

    opacity: 1;
}

/* =========================
   QUESTION
========================= */

.question {
    color: white;

    font-size: clamp(22px, 4vw, 34px);

    text-align: center;

    line-height: 1.3;

    margin-bottom: 35px;

    max-width: 600px;
}

/* =========================
   BUTTON AREA
========================= */

.buttons {
    display: flex;

    justify-content: center;
    align-items: center;

    gap: 30px;

    position: relative;

    width: 100%;

    min-height: 65px;
}

/* =========================
   BUTTON
========================= */

button {
    border: none;

    font-family: Arial, sans-serif;

    font-size: 20px;

    padding: 14px 35px;

    border-radius: 999px;

    cursor: none;

    transition: transform 0.15s ease;
}

.yes {
    background: white;

    color: #ff7fa3;

    box-shadow:
        0 7px 15px rgba(255, 80, 125, 0.25);
}

.yes:hover {
    transform: scale(1.08);
}

.no {
    background: white;

    color: #ff7fa3;

    box-shadow: none;
}

.no.running {
    position: fixed;

    z-index: 50;

    box-shadow: none;
}

/* =========================
   GLOOMY SCREEN
========================= */

.gloom {
    position: fixed;

    inset: 0;

    background: #20202a;

    z-index: 9999;

    transform: translateY(-100%);

    transition: transform 0.7s ease;

    display: flex;

    align-items: center;

    justify-content: center;

    flex-direction: column;

    color: white;

    text-align: center;
}

.gloom.show {
    transform: translateY(0);
}

.gloom-text {
    font-size: clamp(25px, 5vw, 45px);

    margin-bottom: 30px;
}

.reset {
    background: white;

    color: #333;

    font-size: 18px;

    padding: 12px 30px;

    border-radius: 999px;

    border: none;

    cursor: none;
}

/* =========================
   MOBILE
========================= */

@media (hover: none) {

    html,
    body {
        cursor: auto;
    }

    .custom-cursor {
        display: none;
    }

    .cursor-trail {
        display: none;
    }

}

@media (max-width: 600px) {

    .box {
        width: 90vw;

        min-height: 500px;

        padding: 25px;

        border-radius: 28px;
    }

    .character {
        width: 145px;
        height: 145px;
    }

    .question {
        font-size: 23px;

        margin-bottom: 30px;
    }

    .buttons {
        gap: 15px;
    }

    button {
        font-size: 17px;

        padding: 12px 25px;
    }

}

/* =========================
   TOUCH RIPPLE
========================= */

.touch-ripple {
    position: fixed;

    width: 25px;
    height: 25px;

    border-radius: 50%;

    background: rgba(255, 255, 255, 0.55);

    pointer-events: none;

    transform: translate(-50%, -50%);

    animation: ripple 0.6s ease-out forwards;

    z-index: 99997;
}

@keyframes ripple {

    0% {
        opacity: 0.8;
        transform: translate(-50%, -50%) scale(0.5);
    }

    100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(2);
    }

}

</style>
</head>

<body>

<img
    src="Qu%C3%A0%20Veloria%20.png"
    class="custom-cursor"
    id="customCursor"
    alt=""
>

<div class="page">

    <div class="box">

        <img
            src="smilee.png"
            class="character"
            id="character"
            alt=""
        >

        <div class="question">
            Do you want to go on a date with me bibi?
        </div>

        <div class="buttons">

            <button
                class="yes"
                id="yesBtn"
            >
                Yes ♡
            </button>

            <button
                class="no"
                id="noBtn"
            >
                No
            </button>

        </div>

    </div>

</div>

<div
    class="gloom"
    id="gloom"
>

    <div class="gloom-text">
        okay... :(
    </div>

    <button
        class="reset"
        id="resetBtn"
    >
        Reset
    </button>

</div>

<script>

/* =========================
   ELEMENTS
========================= */

const cursor =
    document.getElementById("customCursor");

const character =
    document.getElementById("character");

const yesBtn =
    document.getElementById("yesBtn");

const noBtn =
    document.getElementById("noBtn");

const gloom =
    document.getElementById("gloom");

const resetBtn =
    document.getElementById("resetBtn");


/* =========================
   CURSOR
========================= */

document.addEventListener(
    "mousemove",
    function(event) {

        cursor.style.left =
            event.clientX + "px";

        cursor.style.top =
            event.clientY + "px";

        const trail =
            document.createElement("div");

        trail.className =
            "cursor-trail";

        trail.style.left =
            event.clientX + "px";

        trail.style.top =
            event.clientY + "px";

        document.body.appendChild(trail);

        setTimeout(
            function() {
                trail.remove();
            },
            600
        );

        mouseX = event.clientX;
        mouseY = event.clientY;

        updateExpression();

    }
);


/* =========================
   TOUCH RIPPLE
========================= */

let rippleCount = 0;

document.addEventListener(
    "touchstart",
    function(event) {

        if (rippleCount >= 10) {
            return;
        }

        const touch =
            event.touches[0];

        const ripple =
            document.createElement("div");

        ripple.className =
            "touch-ripple";

        ripple.style.left =
            touch.clientX + "px";

        ripple.style.top =
            touch.clientY + "px";

        document.body.appendChild(ripple);

        rippleCount++;

        setTimeout(
            function() {
                ripple.remove();
                rippleCount--;
            },
            600
        );

    },
    { passive: true }
);


/* =========================
   CHARACTER LOGIC
========================= */

let currentCharacter =
    "smilee.png";

let mouseX = 0;
let mouseY = 0;

let cryyLockUntil = 0;

let noCount = 0;


function changeCharacter(newImage) {

    if (currentCharacter === newImage) {
        return;
    }

    currentCharacter =
        newImage;

    character.src =
        newImage;

}


function isMouseInsideRect(x, y, rect) {

    return (
        x >= rect.left &&
        x <= rect.right &&
        y >= rect.top &&
        y <= rect.bottom
    );

}


function distanceToRectCenter(x, y, rect) {

    const centerX =
        (rect.left + rect.right) / 2;

    const centerY =
        (rect.top + rect.bottom) / 2;

    return Math.sqrt(
        Math.pow(x - centerX, 2) +
        Math.pow(y - centerY, 2)
    );

}


function isCryyLocked() {

    return Date.now() < cryyLockUntil;

}


function updateExpression() {

    if (isCryyLocked()) {
        return;
    }

    if (noCount >= 5) {
        return;
    }

    const yesRect =
        yesBtn.getBoundingClientRect();

    const noRect =
        noBtn.getBoundingClientRect();

    const insideYes =
        isMouseInsideRect(
            mouseX,
            mouseY,
            yesRect
        );

    const insideNo =
        isMouseInsideRect(
            mouseX,
            mouseY,
            noRect
        );

    const nearYes =
        distanceToRectCenter(
            mouseX,
            mouseY,
            yesRect
        ) < 110;

    const nearNo =
        distanceToRectCenter(
            mouseX,
            mouseY,
            noRect
        ) < 110;


    if (insideYes) {

        changeCharacter(
            "smilee.png"
        );

    } else if (
        insideNo ||
        nearNo
    ) {

        changeCharacter(
            "cryy.png"
        );

    } else if (nearYes) {

        changeCharacter(
            "huhh.png"
        );

    }

}


/* =========================
   NO BUTTON MOVEMENT
========================= */

let lastX = null;
let lastY = null;

let noRunning = false;


function moveNo() {

    const buttonWidth =
        noBtn.offsetWidth;

    const buttonHeight =
        noBtn.offsetHeight;

    const margin = 25;

    let newX;
    let newY;

    let attempts = 0;

    let minimumDistance =
        180 + noCount * 50;


    do {

        newX =
            Math.random() *
            (
                window.innerWidth -
                buttonWidth -
                margin * 2
            ) +
            margin;

        newY =
            Math.random() *
            (
                window.innerHeight -
                buttonHeight -
                margin * 2
            ) +
            margin;

        attempts++;

    } while (
        lastX !== null &&
        Math.sqrt(
            Math.pow(newX - lastX, 2) +
            Math.pow(newY - lastY, 2)
        ) < minimumDistance &&
        attempts < 100
    );


    lastX = newX;
    lastY = newY;

    noBtn.style.left =
        newX + "px";

    noBtn.style.top =
        newY + "px";

}


noBtn.addEventListener(
    "click",
    function() {

        noCount++;

        changeCharacter(
            "cryy.png"
        );

        cryyLockUntil =
            Date.now() + 2000;


        if (!noRunning) {

            noRunning = true;

            noBtn.classList.add(
                "running"
            );

        }


        moveNo();


        if (noCount >= 5) {

            setTimeout(
                function() {

                    gloom.classList.add(
                        "show"
                    );

                    noBtn.disabled =
                        true;

                    yesBtn.disabled =
                        true;

                },
                200
            );

            return;
        }


        setTimeout(
            function() {

                checkAfterCryy();

            },
            2000
        );

    }
);


/* =========================
   AFTER 2 SECONDS
========================= */

function checkAfterCryy() {

    if (noCount >= 5) {
        return;
    }

    const yesRect =
        yesBtn.getBoundingClientRect();

    const noRect =
        noBtn.getBoundingClientRect();


    const insideYes =
        isMouseInsideRect(
            mouseX,
            mouseY,
            yesRect
        );

    const insideNo =
        isMouseInsideRect(
            mouseX,
            mouseY,
            noRect
        );

    const nearYes =
        distanceToRectCenter(
            mouseX,
            mouseY,
            yesRect
        ) < 110;

    const nearNo =
        distanceToRectCenter(
            mouseX,
            mouseY,
            noRect
        ) < 110;


    if (insideYes) {

        changeCharacter(
            "smilee.png"
        );

    } else if (nearYes) {

        changeCharacter(
            "huhh.png"
        );

    } else if (
        insideNo ||
        nearNo
    ) {

        changeCharacter(
            "cryy.png"
        );

    }

}


/* =========================
   YES
========================= */

yesBtn.addEventListener(
    "click",
    function() {

        window.location.href =
            "./page3.html";

    }
);


/* =========================
   RESET
========================= */

resetBtn.addEventListener(
    "click",
    function() {

        window.location.reload();

    }
);

</script>

</body>
</html>
